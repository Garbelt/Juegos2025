function handleArrowKeyNavigation(event) {
    const focusedCell = document.activeElement;

    // Asegúrate de que el elemento enfocado sea una celda de entrada
    if (focusedCell.classList.contains('input-cell')) {
        const row = parseInt(focusedCell.getAttribute('data-row'));
        const col = parseInt(focusedCell.getAttribute('data-col'));

        let nextRow = row;
        let nextCol = col;

        switch (event.key) {
            case 'ArrowRight':
                nextCol++;
                break;
            case 'ArrowDown':
                nextRow++;
                break;
            case 'ArrowLeft':
                nextCol--;
                break;
            case 'ArrowUp':
                nextRow--;
                break;
            default:
                return; // No hacer nada si no es una tecla de flecha
        }

        const nextCell = document.querySelector(`.input-cell[data-row="${nextRow}"][data-col="${nextCol}"]`);
        if (nextCell) {
            // Mover el cursor a la siguiente celda
            nextCell.focus();

            // Seleccionar el contenido de la celda al hacer foco en ella
            if (nextCell.value) {
                // Usar setTimeout para asegurarse de que el enfoque se haya aplicado antes de seleccionar
                setTimeout(() => {
                    nextCell.select();
                }, 0);
            }

            // Prevenir el comportamiento predeterminado del navegador
            event.preventDefault();
        }
    }
}

// Agregar el evento keydown solo para la navegación con las flechas
document.addEventListener('keydown', handleArrowKeyNavigation);

        function createCrossword(rows, cols) {
    const crosswordElement = document.getElementById("crossword");
    crosswordElement.innerHTML = ""; // Limpiar cualquier crucigrama anterior

    // Creamos una cuadrícula con las dimensiones especificadas
    const grid = [
[' ', ' ', ' ', ' ', ' ', 'M', 'A', 'T', 'E', ' ', ' ', ' ', ' ', ' ', ' '],
[' ', ' ', ' ', ' ', ' ', ' ', ' ', 'R', 'A', 'N', 'C', 'H', 'O', ' ', ' '],
[' ', ' ', ' ', ' ', 'P', 'A', 'V', 'A', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
[' ', ' ', ' ', ' ', 'A', 'S', 'A', 'D', 'O', ' ', ' ', ' ', ' ', ' ', ' '],
[' ', ' ', ' ', ' ', ' ', 'G', 'U', 'I', 'T', 'A', 'R', 'R', 'A', ' ', ' '],
[' ', ' ', ' ', ' ', ' ', ' ', ' ', 'C', 'A', 'B', 'A', 'L', 'L', 'O', ' '],
[' ', 'P', 'U', 'L', 'P', 'E', 'R', 'I', 'A', ' ', ' ', ' ', ' ', ' ', ' '],
[' ', ' ', ' ', ' ', ' ', ' ', 'B', 'O', 'T', 'A', 'S', ' ', ' ', ' ', ' '],
[' ', ' ', ' ', 'E', 'M', 'P', 'A', 'N', 'A', 'D', 'A', 'S', ' ', ' ', ' '],


];
    for (let row = 0; row < rows; row++) {
        const tr = document.createElement("tr");
        for (let col = 0; col < cols; col++) {
            const td = document.createElement("td");
            const cellValue = grid[row] && grid[row][col] ? grid[row][col] : ' '; // Si no hay datos, usar espacio vacío

            td.className = `crossword-cell ${cellValue === ' ' ? 'black' : ''}`; // Clase para las celdas negras

            if (cellValue !== ' ') {
                td.innerHTML = `<input type="text" maxlength="1" class="input-cell" data-row="${row}" data-col="${col}" />`;
            }

            tr.appendChild(td);
        }
        crosswordElement.appendChild(tr);
    }

    // Añadir las referencias de pistas
    const pistasList = document.getElementById("pistas-list");
    pistasList.innerHTML = ""; // Limpiar pistas anteriores si las hay

    crosswordData.forEach((data, index) => {
        const listItem = document.createElement("li");
        listItem.textContent = `${index + 1}. ${data.clue}`;
        listItem.className = "crossword-clue";
        listItem.setAttribute("data-index", index + 1);

        // Funcionalidad para reproducir el audio al hacer clic
        listItem.addEventListener("click", function() {
            const audio = document.getElementById(`audio-clue-${index + 1}`);
            if (audio) {
                audio.play();
            }

            highlightWord(data, listItem); // Resaltar la palabra
        });

        pistasList.appendChild(listItem);
    });

    // Iniciar el temporizador
    timerInterval = setInterval(updateTimer, 1000);}
// Función para mostrar un mensaje y deshabilitar clics
function showMessageAndDisableClicks(message, duration) {
    const messageElement = document.createElement('div');
    messageElement.className = 'found-message';
    messageElement.innerText = message;
    document.body.appendChild(messageElement);
    document.body.style.pointerEvents = 'none'; // Deshabilitar clics

    setTimeout(() => {
        document.body.removeChild(messageElement);
        document.body.style.pointerEvents = ''; // Habilitar clics
    }, duration);
}


function updateTimer() {
    if (gameEnded) return; // Si el juego ya terminó, no hacer nada
    const relojElement = document.getElementById("reloj");

    const minutes = Math.floor(totalTimeInSeconds / 60);
    const seconds = totalTimeInSeconds % 60;

    relojElement.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

    if (totalTimeInSeconds <= 0) {
        clearInterval(timerInterval);
        endGameByTimeout(); // Llama a la función para manejar el fin del juego por tiempo agotado
    } else {
        totalTimeInSeconds--;
    }
}

// Función para deshabilitar la grilla del crucigrama
function disableCrosswordGrid() {
    const inputCells = document.querySelectorAll('.input-cell');
    inputCells.forEach(cell => {
        cell.disabled = true; // Deshabilitar todas las celdas de entrada
    });
}

// Función para terminar el juego por tiempo agotado
function endGameByTimeout() {
    gameEnded = true;
    disableCrosswordGrid(); // Deshabilitar la grilla del crucigrama
    finalScore = score;
    endGame(); // Guardar datos y actualizar acumulado
    almacenarRegistroConZ(finalScore);
    showMessageAndDisableClicks("TIEMPO AGOTADO", 3000);
    fadeOutMusic(backgroundMusic, 3); // Hace fadeout en 6 segundos
    setTimeout(() => {
        window.location.href = "out.html";
        showMessageAndDisableClicks(`Puntaje obtenido: ${score}`, 7000);
    }, 6000);
}

function endGameByCompletion() {
    disableCrosswordGrid(); // Deshabilitar la grilla del crucigrama
    bonus = calculateBonus();
    score += bonus;
    finalScore = score;
    endGame(); // Guardar datos y actualizar acumulado
    almacenarRegistroConZ(finalScore);
    
    fadeOutMusic(backgroundMusic, 6); // Hace fadeout en 6 segundos
    setTimeout(() => {
        window.location.href = "out.html";
        showMessageAndDisableClicks("HAS COMPLETADO EL CRUCIGRAMA\nPuntaje obtenido: " + score, 7000);
    }, 6000);
}


        let currentlyHighlightedClue = null;

function highlightWord(data, listItem) {
    if (gameEnded) return; // Si el juego ya terminó, no hacer nada
    // Primero, eliminar cualquier resaltado previo
    removeHighlight();

    // Resaltar las celdas correspondientes a la palabra
    const { word, row, col, direction } = data;

    for (let i = 0; i < word.length; i++) {
        let currentRow = row;
        let currentCol = col;

        if (direction === "horizontal") {
            currentCol += i;
        } else if (direction === "vertical") {
            currentRow += i;
        }

        const cell = document.querySelector(`.input-cell[data-row="${currentRow}"][data-col="${currentCol}"]`);
        if (cell) {
            cell.parentElement.classList.add("highlighted"); // Resalta la celda
        }

                // Posicionar el cursor en la primera celda
                if (i === 0) {
                    focusFirstCell(cell);}


    }

    // Resaltar la pista seleccionada
    if (currentlyHighlightedClue) {
        currentlyHighlightedClue.classList.remove("highlighted-clue");
    }
    listItem.classList.add("highlighted-clue");
    currentlyHighlightedClue = listItem;
}



// Asignar evento a todas las celdas de entrada para mover el cursor
document.addEventListener("input", function (event) {
    if (gameEnded) return; // Si el juego ya terminó, no hacer nada
    const input = event.target;
    if (input.classList.contains("input-cell")) {
        const row = parseInt(input.getAttribute("data-row"));
        const col = parseInt(input.getAttribute("data-col"));

        const highlightedClue = document.querySelector(".highlighted-clue");
        if (highlightedClue) {
            const index = parseInt(highlightedClue.getAttribute("data-index")) - 1;
            const wordData = crosswordData[index];

            moveToNextCell(row, col, wordData.direction);
        }
    }
});

function moveToNextCell(row, col, direction) {
    if (gameEnded) return; // Si el juego ya terminó, no hacer nada
    let nextRow = row;
    let nextCol = col;

    if (direction === "horizontal") {
        nextCol++;
    } else if (direction === "vertical") {
        nextRow++;
    }

    const nextCell = document.querySelector(`.input-cell[data-row="${nextRow}"][data-col="${nextCol}"]`);
    if (nextCell) {
        // Mover el cursor a la siguiente celda
        nextCell.focus();

        // Seleccionar el contenido de la celda al hacer foco en ella
        if (nextCell.value) {
            // Usar setTimeout para asegurarse de que el enfoque se haya aplicado antes de seleccionar
            setTimeout(() => {
                nextCell.select();
            }, 0);
        }
    }
}



function focusFirstCell(cell) {
    if (gameEnded) return; // Si el juego ya terminó, no hacer nada
    // Enfocar el cursor en la primera celda de la palabra
    cell.focus();

    // Seleccionar el contenido de la celda al hacer foco en ella
    if (cell.value) {
        // Usar setTimeout para asegurarse de que el enfoque se haya aplicado antes de seleccionar
        setTimeout(() => {
            cell.select();
        }, 0);
    }
}


        function removeHighlight() {
    if (gameEnded) return; // Si el juego ya terminó, no hacer nada
            // Eliminar el resaltado de las celdas
            const highlightedCells = document.querySelectorAll(".highlighted");
            highlightedCells.forEach(cell => {
                cell.classList.remove("highlighted");
            });

            // Eliminar el resaltado de la pista
            if (currentlyHighlightedClue) {
                currentlyHighlightedClue.classList.remove("highlighted-clue");
                currentlyHighlightedClue = null;
            }
        }

        document.getElementById("btn-corregir").addEventListener("click", function() {
            checkAnswers();
        });

        let correctedWords = new Set(); // Almacena palabras ya corregidas


function calculateBonus() {
    const totalWords = crosswordData.length; // Suponiendo que `crosswordData` contiene todas las palabras del crucigrama
    const calculatedBonus = Math.ceil((totalTimeInSeconds / 10) * 5); // Redondear al entero superior
    return totalWords + Math.max(1, calculatedBonus); // Asegurarse de que el bono mínimo sea 1
}


function checkAnswers() {
    if (gameEnded) return; // Si el juego ya terminó, no hacer nada

    let cellsToMarkRed = [];
    let cellsToMarkGreen = [];
    let wordsCorrectedInThisRound = new Set(); // Para rastrear las palabras corregidas en esta ejecución
    let allWordsCorrect = true; // Bandera para determinar si todas las palabras son correctas

    // Deshabilitar clics mientras se ejecuta la corrección
    document.body.style.pointerEvents = 'none';

    // Primer paso: identificar celdas incorrectas y almacenarlas en un array
    crosswordData.forEach((data) => {
        const { word, row, col, direction } = data;
        let correct = true;
        let cellsToUpdate = [];

        for (let i = 0; i < word.length; i++) {
            let currentRow = row;
            let currentCol = col;

            if (direction === "horizontal") {
                currentCol += i;
            } else if (direction === "vertical") {
                currentRow += i;
            }

            const cell = document.querySelector(`.input-cell[data-row="${currentRow}"][data-col="${currentCol}"]`);
            if (cell) {
                cellsToUpdate.push(cell); // Almacena la celda para actualizarla después

                if (cell.value.toUpperCase() !== word[i]) {
                    correct = false;
                    allWordsCorrect = false; // Si una palabra es incorrecta, el crucigrama no está completo
                }
            }
        }

        // Almacenar las celdas incorrectas o correctas
        if (!correct) {
            cellsToMarkRed.push(...cellsToUpdate);
        } else {
            cellsToMarkGreen.push(...cellsToUpdate);
            wordsCorrectedInThisRound.add(word); // Marcar la palabra como corregida en esta ejecución
        }
    });

    // Aplicar el color rojo primero a las celdas incorrectas
    cellsToMarkRed.forEach((cell) => {
        cell.style.backgroundColor = "#E74C3C"; // Rojo claro
        cell.style.color = "#000"; // Color de texto negro

        // Revertir el formato de error después de 5 segundos
        setTimeout(() => {
            if (cell.style.backgroundColor === "rgb(231, 76, 60)") { // Verificar el color rojo en formato RGB
                cell.style.backgroundColor = ""; // Restablecer el color de fondo
                cell.style.color = ""; // Restablecer el color del texto
            }
        }, 5000);
    });

    // Aplicar el color verde después a las celdas correctas
    cellsToMarkGreen.forEach((cell) => {
        cell.style.backgroundColor = "#52BE80"; // Verde claro
        cell.style.color = "#000"; // Color de texto negro
    });

    // Sumar puntos solo por las palabras correctas que no hayan sido corregidas antes
    let newScore = 0;
    wordsCorrectedInThisRound.forEach(() => {
        newScore += 20; // Sumar 20 puntos por cada palabra
    });

    score = newScore; // Asignar el nuevo puntaje calculado
    const puntajeElement = document.getElementById("puntaje");
    puntajeElement.textContent = `${score}`;

    // Mostrar el mensaje de corrección y deshabilitar clics mientras el mensaje está en pantalla
    showMessageAndDisableClicks("¡RESPUESTAS CORREGIDAS!", 3000);

    // Verificar si el crucigrama está completamente correcto
    if (allWordsCorrect) {
        gameEnded = true;
        endGameByCompletion();
    } else {
        // Rehabilitar clics si el juego no ha terminado
        setTimeout(() => {
            document.body.style.pointerEvents = ''; // Habilitar clics nuevamente
        }, 3000);
    }
}

const backgroundMusic = document.getElementById('background-music');

function fadeOutMusic(audioElement, duration) {
    let volume = audioElement.volume; // Obtiene el volumen actual
    let fadeInterval = 50; // Intervalo de tiempo en milisegundos
    let fadeStep = volume / (duration * 1000 / fadeInterval); // Cálculo de cuánto disminuir el volumen en cada paso

    let fadeOut = setInterval(function() {
        if (volume > 0) {
            volume -= fadeStep;
            if (volume < 0) volume = 0; // Asegurarse de que el volumen no sea menor que 0
            audioElement.volume = volume; // Ajustar el volumen del elemento de audio
        } else {
            clearInterval(fadeOut); // Detener el fadeout cuando el volumen llegue a 0
            audioElement.pause(); // Pausar la música
            audioElement.currentTime = 0; // Reiniciar la música desde el principio si se reproduce de nuevo
        }
    }, fadeInterval);
}

function endGame() {
    const currentDate = new Date().toLocaleDateString();
    const userData = {
        fecha: currentDate,
        usuario: localStorage.getItem("ActualUs"),
        puntaje: score,
        juegonumero: incrementGameNumber(),
        game: "HNA_crcgrm",
        rutina: localStorage.getItem("rutina")
    };

    // Guardar en el historial de juegos
    const gamesHistory = JSON.parse(localStorage.getItem("gamesHistory")) || [];
    gamesHistory.push(userData);
    localStorage.setItem("gamesHistory", JSON.stringify(gamesHistory));

    // Actualizar puntaje acumulado
    updateAcumulado(score);
   
    // Mostrar mensaje con retraso
    setTimeout(() => showMessageWithDelay(), 3000);
}

// Función para actualizar el puntaje acumulado
function updateAcumulado(scoreToAdd) {
    let acumulado = parseInt(localStorage.getItem("acumulado")) || 0;
    acumulado += scoreToAdd;
    localStorage.setItem("acumulado", acumulado);
}

// Función para incrementar el número del juego
function incrementGameNumber() {
    let gameNumber = parseInt(localStorage.getItem("gameNumber")) || 0;
    gameNumber++;
    localStorage.setItem("gameNumber", gameNumber);
    return gameNumber;
}
